[package]
name = "t3-selfhosted-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
mime_guess = "2"
percent-encoding = "2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7", features = ["io", "rt"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
